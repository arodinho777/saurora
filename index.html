<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Saurora</title>
<style>
:root{--bg:#121412;--fg:#e8e4da;--dim:#a9a397;--line:#2c302b;--accent:#d9a85b;--card:#1a1d19;--mark:#5a3d12}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:32px 16px 64px}
nav{max-width:720px;margin:0 auto;padding:16px 16px 0;display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px}
nav a{color:var(--dim);text-decoration:none}nav a:hover,nav a[aria-current]{color:var(--accent)}
h1{font-size:28px;line-height:1.2;margin:8px 0 16px;letter-spacing:.01em}
h2{font-size:19px;margin:32px 0 8px;color:var(--accent)}
p,ul,ol{margin:0 0 14px}li{margin:4px 0}
a{color:var(--accent)}strong{color:#fff}
.t{overflow-x:auto;margin:0 0 16px;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--line)}
th{background:var(--card);color:var(--dim);font-weight:600}tr:last-child td{border-bottom:0}
mark{background:var(--mark);color:#fff;padding:0 3px;border-radius:3px}
footer{color:var(--dim);font-size:14px;border-top:1px solid var(--line);margin-top:40px;padding-top:16px}
</style>
</head>
<body>

</body>
</html>
